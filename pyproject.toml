[tool.poetry]
name = "pydelphi"
# DEV NOTE: keep this synchronized with pydelphi/__init__.py.
version = "0.2.1.dev260709"
description = "pyDelPhi — a Python/Numba/CUDA implementation of the DelPhi Poisson–Boltzmann solver for biomolecular electrostatics and solvation energy calculations."
authors = [
  "Shailesh Kumar Panday <shaileshp51@gmail.com>"
]
maintainers = [
  "pyDelPhi Development Team <https://github.com/delphi001/pyDelPhi/issues>"
]
license = "AGPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "pydelphi" }]

# Project-level Conda specifications are useful to source-distribution users,
# but are not runtime package data and therefore are shipped in the sdist only.
include = [
    "README.md",
    "LICENSE",
    "AUTHORS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    { path = "environment.yml", format = ["sdist"] },
    { path = "environment-traj.yml", format = ["sdist"] },
    "pydelphi/data/**/*.tsv",
    "pydelphi/data/**/*.prm",
    "pydelphi/data/**/*.pqr",
    "pydelphi/data/**/*.pdb",
    "pydelphi/data/**/*.siz",
    "pydelphi/data/**/*.crg",
    "pydelphi/data/**/*.zeta",
    "pydelphi/data/**/*.frc",
    "pydelphi/data/**/*.vdw",
    "pydelphi/data/**/*.bib",
    "pydelphi/tests/**/*",
    "pydelphi/examples/**/*.pqr",
    "pydelphi/examples/**/*.prm",
    "pydelphi/examples/**/*.md",
    "pydelphi/examples/**/*.pdb",
    "pydelphi/examples/**/*.siz",
    "pydelphi/examples/**/*.crg"
]
exclude = [
    "**/*.bak",
    "**/*~",
    "**/*.npy",
    "**/*.npz",
    "**/*.log",
    "**/*.txt",
    "**/*.pyc",
    "**/*.pyo",
    "**/__pycache__/**",
    ".pytest_cache/**",
    ".mypy_cache/**",
    ".ruff_cache/**"
]

repository = "https://github.com/delphi001/pyDelPhi"
homepage = "https://github.com/delphi001/pyDelPhi"
documentation = "https://github.com/delphi001/pyDelPhi/wiki"

keywords = [
    "Poisson-Boltzmann",
    "Electrostatics",
    "Electrostatic potential",
    "Polar solvation free energy",
    "Biophysics",
    "Continuum Solvent",
    "DelPhi",
    "CUDA",
    "Numba"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries"
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
numpy = ">=2.3.5,<2.4"
numba = ">=0.62.1,<0.63"

# Deliberately not declared as package requirements:
#
# - numba-cuda: accelerator support. Recommended Conda environments install it,
#   but pyDelPhi CPU mode must remain usable when it is absent, disabled, or
#   unable to initialize because no compatible NVIDIA driver/device is present.
#
# - netCDF4: trajectory/NetCDF support. The tested release is 1.7.3 and
#   is pinned in environment-traj.yml. Trajectory code must import it lazily and report a
#   feature-specific installation message when unavailable.
#
# Do not add a Poetry "cuda" extra: CUDA availability is a runtime capability,
# not a requirement for installing or running the CPU backend.

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
flake8 = "^6.0.0"

[tool.poetry.scripts]
pydelphi-static = "pydelphi.scripts.pydelphi_static:main"
pydelphi-trajectory = "pydelphi.scripts.pydelphi_traj:main"
pydelphi-help = "pydelphi.scripts.pydelphi_help:main"
pydelphi-test = "pydelphi.tests.test_energy_regression:main"
pydelphi-test-traj = "pydelphi.tests.test_traj_regression:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
